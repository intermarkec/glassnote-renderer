<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" version="1.1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="rg" cx="0.5" cy="0.5" r="0.5" gradientTransform="matrix(1,0,0,0.6,0,0.2)">
      <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cp" clipPathUnits="userSpaceOnUse">
      <circle cx="150" cy="150" r="90"/>
    </clipPath>
    <mask id="mk" maskUnits="userSpaceOnUse" x="300" y="40" width="260" height="200">
      <rect x="300" y="40" width="260" height="200" fill="url(#lg)"/>
    </mask>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="pat" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#e2e8f0"/><circle cx="8" cy="8" r="3" fill="#94a3b8"/>
    </pattern>
    <rect x="316" y="250" width="228" height="110" id="marco"/>
  </defs>

  <rect width="600" height="400" fill="url(#pat)"/>

  <g id="grupo-clip" transform="translate(10,10) rotate(-6 150 150)" clip-path="url(#cp)">
    <rect x="60" y="60" width="180" height="180" fill="url(#lg)"/>
    <circle cx="150" cy="150" r="60" fill="url(#rg)"/>
    <path d="M 80,220 L 150,90 L 220,220 Z" fill="#fff" fill-opacity="0.45"/>
  </g>

  <g id="grupo-mask" mask="url(#mk)" opacity="0.95">
    <rect x="300" y="40" width="260" height="200" fill="#0f172a"/>
    <g transform="translate(320,70)" filter="url(#blur)">
      <circle cx="40" cy="40" r="34" fill="#22c55e"/>
      <circle cx="110" cy="60" r="34" fill="#ef4444"/>
    </g>
  </g>

  <g id="grupo-texto" transform="translate(0,0)">
    <rect x="316" y="250" width="228" height="110" fill="#ffffff" fill-opacity="0.85" stroke="#334155"/>
    <text xml:space="preserve" id="cuerpo" clip-path="url(#cp2)"
       style="font-size:15px;line-height:1.3;font-family:DejaVu Sans;white-space:pre;shape-inside:url(#marco);shape-padding:8;text-align:justify;fill:#0f172a">Aviso para %NOMBRE%: %ASUNTO% y conviene revisarlo.</text>
  </g>

  <g id="grupo-plano" transform="translate(20,300)">
    <text x="0" y="0" style="font-size:20px;font-family:DejaVu Sans;fill:#0f172a">Plano: <tspan style="font-weight:bold;fill:#b91c1c">%NOMBRE%</tspan></text>
    <text x="0" y="30" style="font-size:14px;font-family:DejaVu Sans;fill:#475569">Segunda linea intacta</text>
  </g>
</svg>
